name: ci

# The Go and Nix gates run independently so failures are isolated by toolchain.

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go · vet · lint · test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
      - name: Install analysis tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install go.uber.org/nilaway/cmd/nilaway@acb8859b9031bb9496be97e027df5573f9fb5340
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/google/go-licenses/v2@v2.0.1
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Vet portable packages
        shell: bash
        run: |
          # cmd/tess has a Darwin-only backend and is excluded from Linux vet.
          mapfile -t packages < <(CGO_ENABLED=1 GOOS=linux go list -f '{{if and .GoFiles (not .CgoFiles)}}{{.ImportPath}}{{end}}' ./... | grep -v /cmd/tess)
          GOOS=linux go vet "${packages[@]}"

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Lint
        run: golangci-lint run --config .golangci.yml ./...

      - name: Check nil safety
        run: nilaway -include-pkgs=github.com/mattwilkinsonn/tessera -test=false ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      - name: Stress-test daemon and effects
        run: go test -race -count=20 ./internal/daemon/... ./internal/effects/...

      - name: Check vulnerabilities
        run: govulncheck ./...

      - name: Check licenses
        run: >-
          go-licenses check ./...
          --allowed_licenses=Apache-2.0,Apache-2.0-WITH-LLVM-exception,MIT,BSD-3-Clause,BSD-2-Clause,ISC,Unicode-3.0,Zlib,MPL-2.0,CC0-1.0
          --ignore github.com/mattwilkinsonn/tessera

  nix:
    name: nix flake · darwin build
    # The tess package is platforms.darwin, so it can only build on a macOS
    # runner. Kept a distinct job from `go` so a flake break is isolated from
    # the Go quality gate.
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tree: ${{ steps.key.outputs.tree }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tree key
        id: key
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"

      - name: Build releasepin
        run: go build -o "$RUNNER_TEMP/releasepin" ./tools/releasepin

      - name: Reuse artifact
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TREE: ${{ steps.key.outputs.tree }}
        run: '"$RUNNER_TEMP/releasepin" select -repo "$GITHUB_REPOSITORY" -tree "$TREE" -commit "$GITHUB_SHA" -out "$RUNNER_TEMP/out" >> "$GITHUB_OUTPUT"'

      - name: Verify reused artifact
        if: steps.reuse.outputs.hit == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          tar -xzf "$RUNNER_TEMP/out/tess-darwin-arm64.tar.gz" -C "$RUNNER_TEMP/check"
          codesign --verify --strict "$RUNNER_TEMP/check/bin/tess"
          test "$("$RUNNER_TEMP/check/bin/tess" --version)" = "tess v$(tr -d '[:space:]' < VERSION)"

      - name: Install Nix
        if: steps.reuse.outputs.hit != 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Flake check
        if: steps.reuse.outputs.hit != 'true'
        run: nix flake check

      - name: Build tess
        if: steps.reuse.outputs.hit != 'true'
        run: nix build .#default

      - name: Verify tess version
        if: steps.reuse.outputs.hit != 'true'
        run: test "$(./result/bin/tess --version)" = "tess v$(tr -d '[:space:]' < VERSION)"

      - name: Verify signature and pack
        if: steps.reuse.outputs.hit != 'true'
        run: |
          codesign --verify --strict result/bin/tess
          mkdir -p "$RUNNER_TEMP/out"
          tar -czf "$RUNNER_TEMP/out/tess-darwin-arm64.tar.gz" -C "$(readlink -f result)" bin share
          "$RUNNER_TEMP/releasepin" provenance -tarball "$RUNNER_TEMP/out/tess-darwin-arm64.tar.gz" -commit "$GITHUB_SHA" -out "$RUNNER_TEMP/out/provenance.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ${{ runner.temp }}/out
          name: tess-darwin-arm64-${{ steps.key.outputs.tree }}
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}
          if-no-files-found: error
