name: ci

# The gate for every PR and push to main. Tessera is a single zero-dependency
# Bun/TypeScript tool, so CI is just Bun: install, typecheck, lint, test — the
# same three checks the devenv shell runs locally. No monorepo build system.

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint + format check
        run: bun run check

      - name: Test
        run: bun test

  nix:
    name: nix flake · darwin build
    # The tess package is platforms.darwin, so it can only build on a macOS
    # runner. Kept a distinct job from `check` so a flake break is isolated
    # from the Bun quality gate.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check

      - name: Build tess
        run: nix build .#default
