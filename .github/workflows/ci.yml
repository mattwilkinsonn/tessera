name: ci

# The Go and Nix gates run independently so failures are isolated by toolchain.

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go · vet · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: golangci-lint run

      - name: Test
        run: go test -race ./...

  nix:
    name: nix flake · darwin build
    # The tess package is platforms.darwin, so it can only build on a macOS
    # runner. Kept a distinct job from `go` so a flake break is isolated from
    # the Go quality gate.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Flake check
        run: nix flake check

      - name: Build tess
        run: nix build .#default

      - name: Verify tess version
        run: test "$(./result/bin/tess --version)" = "tess v$(tr -d '[:space:]' < VERSION)"
