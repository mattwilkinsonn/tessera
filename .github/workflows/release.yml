name: release

# Merge-driven, version-guarded GitHub release. Every push to main reads the
# version from VERSION and cuts a v<version> release only if that release does
# not already exist. Quality gating lives in ci.yml; this workflow runs no checks.

"on":
  push:
    branches: [main]

# Queue, do not cancel: two rapid version-bump merges must each get released.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: cut release if version is new
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cut release for new version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping."
          else
            echo "Cutting release v$VERSION."
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi
