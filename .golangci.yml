# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
#
# Enable every linter by default. Disable only with a reason, so linter upgrades
# enable new checks until this policy explicitly reviews them.
# The linter version is pinned in devenv.nix and CI for deliberate upgrades.
#
# Exhaustiveness uses gochecksumtype for sum types and exhaustive for enums.

version: "2"

linters:
  default: all
  enable:
    - gochecksumtype # Enforce exhaustive switches over sum types.
    - exhaustive # Enforce exhaustive switches over enums.
    - sloglint # Enforce consistent structured logging.

  disable:
    # Formatting checks are handled by gofmt or are stylistic.
    - wsl # Blank-line and cuddle rules are stylistic.
    - wsl_v5 # Successor to wsl; same stylistic concern.
    - nlreturn # Requiring blank lines before returns is stylistic.
    - lll # Line-length limits are not a correctness check.
    - whitespace # gofmt governs whitespace.
    - embeddedstructfieldcheck # Blank lines between fields are cosmetic.

    # These checks conflict with common Go idioms.
    - exhaustruct # Partial struct literals and zero values are idiomatic.
    - exhaustruct_v5 # Successor to exhaustruct; same concern.
    - varnamelen # Short local names are idiomatic Go.
    - ireturn # Returning interfaces is idiomatic Go.
    - gochecknoglobals # Sentinel errors are package-level variables by design.
    - err113 # Inline wrapped errors are idiomatic Go.
    - noinlineerr # If-scoped errors are idiomatic Go.
    - wrapcheck # Errors are wrapped at package boundaries.
    - mnd # Some numeric constants are self-describing in context.
    - nonamedreturns # Named returns are useful for deferred cleanup.
    - godoclint # Descriptive package comments need no fixed template.

    # These require a repository-wide policy not established here.
    - tagliatelle # Struct tags follow external and persisted wire formats.
    - importas # No import-alias convention is established.
    - testpackage # Tests may need access to package internals.
    - paralleltest # Not every test can run in parallel.
    - gomodguard # Deprecated alias; gomodguard_v2 is configured below.

    # Tracked TODOs are allowed.
    - godox # TODOs may include issue references.

  settings:
    # Import restrictions are deny-list policy. Architectural subprocess seams
    # use a reasoned per-site nolint directive.
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io or os (0 uses — clean ratchet)
            - pkg: crypto/md5
              desc: weak hash; use crypto/sha256 or better (0 uses — clean ratchet)
            - pkg: crypto/sha1
              desc: weak hash; use crypto/sha256 or better (0 uses — clean ratchet)
            - pkg: math/rand
              desc: non-crypto RNG; use crypto/rand for security-sensitive randomness (test fixtures exempt below)
            - pkg: math/rand/v2
              desc: non-crypto RNG; use crypto/rand for security-sensitive randomness (test fixtures exempt below)
            - pkg: os/exec
              desc: direct subprocess exec must be a justified seam; annotate the site //nolint:depguard // <reason>

    gomodguard_v2:
      blocked:
        - module: github.com/pkg/errors
          recommendations:
            - errors
          reason: use stdlib errors with %w wrapping; not a dependency today — clean ratchet

    cyclop:
      max-complexity: 30
    gocognit:
      min-complexity: 40
    funlen:
      lines: 120
      statements: 80
    nestif:
      min-complexity: 8

    goconst:
      ignore-tests: true

    gochecksumtype:
      default-signifies-exhaustive: false
    exhaustive:
      default-signifies-exhaustive: true

    sloglint:
      no-mixed-args: true
      kv-only: false
      key-naming-case: snake
      static-msg: false

    forbidigo:
      forbid:
        - pattern: '^errors\.As$'
          msg: use errors.AsType[T]
        - pattern: '^time\.Sleep$'
          msg: fixed sleeps are nondeterministic; wait on observable state instead
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
          msg: use log/slog instead of debug prints

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    revive:
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - forcetypeassert
          - dupl
          - goconst
          - containedctx
          - errorlint
          - predeclared
          - depguard

formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
