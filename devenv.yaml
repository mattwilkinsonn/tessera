# devenv inputs. Rolling nixpkgs is devenv's recommended channel for dev
# shells — newer than a release channel, curated for devenv.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  bun2nix:
    url: github:nix-community/bun2nix/0f2a1f0b6f42cebe3b149bf62d38754c5e0e9729
    inputs:
      nixpkgs:
        follows: nixpkgs
    overlays:
      - default
